<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F2ED" />
    <meta name="robots" content="noindex" />
    <title>Sin conexión · TRAZA</title>
    <!--
      Generic offline page, served by the service worker only when a navigation fails for lack of
      network. Static and public: it never contains user data, and TRAZA never shows cached private
      pages offline.
    -->
    <style>
      :root {
        --sand: #f4f2ed;
        --paper: #faf9f6;
        --charcoal: #1f1f1f;
        --graphite: #6b6f72;
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--sand);
        color: var(--charcoal);
        font-family: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 480px;
        margin: 0 auto;
        padding: calc(env(safe-area-inset-top) + 1.25rem) max(1.25rem, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 3rem)
          max(1.25rem, env(safe-area-inset-left));
      }
      .mark {
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.36em;
      }
      .mark svg {
        width: 10px;
        height: 10px;
      }
      .tag,
      .meta {
        font-family: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--graphite);
      }
      h1 {
        margin: 2.75rem 0 0;
        font-size: 44px;
        line-height: 1.02;
        font-weight: 300;
        letter-spacing: -0.035em;
      }
      p {
        margin: 0.75rem 0 0;
        max-width: 38ch;
        font-size: 15px;
        line-height: 1.55;
        color: var(--graphite);
      }
      .rule {
        margin-top: 2.5rem;
        border-top: 1px solid rgb(31 31 31 / 0.1);
        padding-top: 1rem;
      }
      button {
        margin-top: 1.5rem;
        min-height: 44px;
        padding: 0 1rem;
        border: 1px solid rgb(31 31 31 / 0.15);
        border-radius: 6px;
        background: var(--paper);
        color: var(--charcoal);
        font: inherit;
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid #8fa7a3;
        outline-offset: 2px;
      }
      @media (min-width: 1024px) {
        main {
          max-width: 640px;
          padding-top: 3rem;
        }
        h1 {
          margin-top: 6rem;
          font-size: 64px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="mark">
        <svg aria-hidden="true" viewBox="0 0 10 10" fill="none" stroke="currentColor">
          <rect x="0.5" y="0.5" width="9" height="9" stroke-width="1" />
          <path d="M0.5 9.5 9.5 0.5" stroke-width="1" />
        </svg>
        TRAZA
      </span>
      <h1>Sin conexión</h1>
      <p role="status">TRAZA necesita conexión para acceder a tus datos actualizados. Comprueba la red e inténtalo de nuevo.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
      <p class="rule meta">TRAZA no guarda tus datos en este dispositivo</p>
    </main>
  </body>
</html>
